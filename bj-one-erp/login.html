<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BJ ONE ERP | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#B71C1C,#D32F2F);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.card{

width:1000px;

max-width:100%;

background:#fff;

border-radius:20px;

overflow:hidden;

display:flex;

box-shadow:0 25px 60px rgba(0,0,0,.25);

}

.left{

width:50%;

background:#C62828;

color:white;

padding:60px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

}

.left img{

width:140px;

height:140px;

object-fit:contain;

background:white;

padding:10px;

border-radius:50%;

margin-bottom:30px;

}

.left h1{

font-size:42px;

margin-bottom:15px;

}

.left h3{

font-weight:400;

margin-bottom:25px;

}

.left p{

line-height:30px;

font-size:17px;

}

.right{

width:50%;

padding:60px;

display:flex;

flex-direction:column;

justify-content:center;

}

.right h2{

font-size:34px;

color:#C62828;

margin-bottom:10px;

}

.subtitle{

color:#666;

margin-bottom:35px;

line-height:28px;

}

.login-panel{

border:1px solid #eee;

padding:35px;

border-radius:15px;

background:#fafafa;

}

#googleButton{

display:flex;

justify-content:center;

margin-bottom:20px;

}

.status{

margin-top:20px;

padding:12px;

border-radius:8px;

display:none;

font-size:15px;

}

.success{

background:#E8F5E9;

color:#2E7D32;

}

.error{

background:#FFEBEE;

color:#C62828;

}

.loading{

background:#FFF8E1;

color:#EF6C00;

}

.footer{

margin-top:35px;

text-align:center;

font-size:13px;

color:#777;

}

@media(max-width:900px){

.card{

flex-direction:column;

}

.left,.right{

width:100%;

}

.left{

padding:40px;

}

.right{

padding:35px;

}

.left h1{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="card">

<div class="left">

<img src="assets/images/logo.png" alt="School Logo">

<h1>BJ ONE ERP</h1>

<h3>Bal Jyoti Public School</h3>

<p>

School Operating System

<br><br>

Please sign in using your official

<strong>@baljyoti.com</strong>

Google Workspace account.

</p>

</div>

<div class="right">

<h2>Welcome</h2>

<p class="subtitle">

Secure access for authorised staff members.

</p>

<div class="login-panel">

<div id="googleButton"></div>

<div id="loading" class="status loading">

Authenticating...

</div>

<div id="success" class="status success">

Login Successful.

Redirecting...

</div>

<div id="error" class="status error"></div>

</div>

<div class="footer">

Version 1.0.1

<br>

© 2026 Bal Jyoti Public School

</div>

</div>

</div>

<script>

const CLIENT_ID="594079296208-rrfpja5335vp8cv9vt8fnofub0au20pb.apps.googleusercontent.com";

window.onload=function(){

google.accounts.id.initialize({

client_id:CLIENT_ID,

callback:onGoogleLogin

});

google.accounts.id.renderButton(

document.getElementById("googleButton"),

{

theme:"outline",

size:"large",

shape:"pill",

width:340,

text:"continue_with"

}

);

};

function onGoogleLogin(response){

showLoading();

const profile=parseJwt(response.credential);

if(!profile.email.endsWith("@baljyoti.com")){

showError("Only @baljyoti.com users are allowed.");

google.accounts.id.disableAutoSelect();

return;

}

showSuccess();

console.log(profile);

setTimeout(function(){

window.location.href="dashboard.html";

},1500);

}

function parseJwt(token){

let base64Url=token.split('.')[1];

let base64=base64Url.replace(/-/g,'+').replace(/_/g,'/');

let jsonPayload=decodeURIComponent(atob(base64).split('').map(function(c){

return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);

}).join(''));

return JSON.parse(jsonPayload);

}

function hideAll(){

document.getElementById("loading").style.display="none";

document.getElementById("success").style.display="none";

document.getElementById("error").style.display="none";

}

function showLoading(){

hideAll();

document.getElementById("loading").style.display="block";

}

function showSuccess(){

hideAll();

document.getElementById("success").style.display="block";

}

function showError(message){

hideAll();

const error=document.getElementById("error");

error.innerHTML=message;

error.style.display="block";

}

</script>

</body>
