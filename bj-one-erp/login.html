<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJ ONE ERP | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#C62828;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.login-box{

    width:420px;

    background:#FFFFFF;

    border-radius:16px;

    padding:40px;

    text-align:center;

    box-shadow:0 20px 40px rgba(0,0,0,.25);

}

.logo{

    width:90px;

    height:90px;

    border-radius:50%;

    display:block;

    margin:0 auto 20px;

    object-fit:contain;

}

h1{

    color:#C62828;

    margin-bottom:8px;

    font-size:28px;

}

h3{

    color:#666;

    font-weight:500;

    margin-bottom:30px;

}

#googleButton{

    display:flex;

    justify-content:center;

    margin-bottom:20px;

}

#status{

    color:#666;

    font-size:14px;

    margin-top:15px;

}

.footer{

    margin-top:30px;

    font-size:12px;

    color:#888;

}

</style>

</head>

<body>

<div class="login-box">

    <img src="https://baljyoti.com/logo.png"
         class="logo"
         alt="Bal Jyoti Public School">

    <h1>BJ ONE ERP</h1>

    <h3>Bal Jyoti Public School</h3>

    <div id="googleButton"></div>

    <div id="status">
        Initializing authentication...
    </div>

    <div class="footer">
        © 2026 Bal Jyoti Public School
    </div>

</div>

<!-- Configuration -->
<script src="config.js"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Authentication -->
<script src="auth.js"></script>

<script>

window.addEventListener("load", function () {

    const status = document.getElementById("status");

    const timer = setInterval(function () {

        if (
            typeof Auth !== "undefined" &&
            Auth.initialized &&
            typeof google !== "undefined" &&
            google.accounts &&
            google.accounts.id
        ) {

            clearInterval(timer);

            status.innerHTML = "Authentication Ready.";

            google.accounts.id.renderButton(

                document.getElementById("googleButton"),

                {
                    theme: "outline",
                    size: "large",
                    width: 320,
                    text: "continue_with"
                }

            );

        }

    }, 300);

});

</script>

</body>

</html>
