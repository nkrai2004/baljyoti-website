<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJ ONE ERP | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#f4f4f4;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

}

.login-card{

    width:420px;

    background:#fff;

    padding:40px;

    border-radius:18px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.15);

}

.logo{

    width:90px;

    height:90px;

    object-fit:contain;

    margin-bottom:20px;

}

h1{

    color:#C62828;

    margin-bottom:8px;

}

.subtitle{

    color:#666;

    margin-bottom:30px;

    line-height:1.6;

}

#googleButton{

    display:flex;

    justify-content:center;

    margin-bottom:25px;

}

.status{

    color:#777;

    font-size:14px;

    margin-bottom:20px;

}

.footer{

    color:#999;

    font-size:13px;

    margin-top:20px;

}

.version{

    margin-top:8px;

    font-size:12px;

}

</style>

</head>

<body>

<div class="login-card">

<img src="assets/logo.png"
     class="logo"
     alt="Bal Jyoti Public School">

<h1>

BJ ONE ERP

</h1>

<div class="subtitle">

Bal Jyoti Public School

<br>

Enterprise Resource Planning System

</div>

<div id="googleButton"></div>

<div id="status" class="status">

Loading Google Sign-In...

</div>

<div class="footer">

© 2026 Bal Jyoti Public School

<div class="version">

Version 4.0

</div>

</div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>

window.addEventListener("load", function(){

    const status=document.getElementById("status");

    if(typeof Auth==="undefined"){

        status.innerHTML="Authentication library not loaded.";

        return;

    }

    Auth.init();

    let retry=0;

    const timer=setInterval(function(){

        retry++;

        if(

            typeof google!=="undefined" &&

            google.accounts &&

            google.accounts.id &&

            Auth.initialized

        ){

            clearInterval(timer);

            google.accounts.id.renderButton(

                document.getElementById("googleButton"),

                {

                    theme:"filled_blue",

                    size:"large",

                    shape:"pill",

                    width:320

                }

            );

            status.innerHTML="Please sign in with your school Google account.";

        }

        if(retry>50){

            clearInterval(timer);

            status.innerHTML="Unable to load Google Sign-In.";

        }

    },200);

});

</script>

</body>

</html>
