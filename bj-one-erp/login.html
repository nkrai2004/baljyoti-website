<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BJ ONE ERP | Login</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#f4f4f4;

}

.login-card{

width:420px;

background:#ffffff;

padding:40px;

border-radius:16px;

box-shadow:0 10px 35px rgba(0,0,0,.12);

text-align:center;

}

.logo{

width:90px;

height:90px;

margin:auto;

margin-bottom:20px;

display:block;

}

h1{

font-size:28px;

color:#C62828;

margin-bottom:8px;

}

.subtitle{

font-size:15px;

color:#666;

margin-bottom:30px;

}

#googleButton{

display:flex;

justify-content:center;

margin-top:20px;

}

.footer{

margin-top:35px;

font-size:13px;

color:#777;

}

.version{

margin-top:10px;

font-size:12px;

color:#999;

}

.loading{

margin-top:15px;

font-size:13px;

color:#888;

}

</style>

</head>

<body>

<div class="login-card">

<img src="assets/logo.png"
     class="logo"
     alt="Bal Jyoti Public School">

<h1>

BJ ONE ERP

</h1>

<div class="subtitle">

Bal Jyoti Public School

<br>

Enterprise Resource Planning System

</div>

<div id="googleButton"></div>

<div class="loading">

Sign in using your authorised Google account.

</div>

<div class="footer">

© 2026 Bal Jyoti Public School

<div class="version">

Version 4.0

</div>

</div>

</div>

<!-- Google Identity -->

<script src="https://accounts.google.com/gsi/client"
        async
        defer></script>

<!-- Configuration -->

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>

window.onload=function(){

if(typeof Auth==="undefined") return;

Auth.init();

setTimeout(function(){

if(typeof google!=="undefined" &&
google.accounts &&
google.accounts.id){

google.accounts.id.renderButton(

document.getElementById("googleButton"),

{

theme:"filled_blue",

size:"large",

shape:"pill",

width:320

}

);

}

},700);

};

</script>

</body>

</html>
