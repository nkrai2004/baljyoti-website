<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BJ ONE ERP | Login</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<script src="https://accounts.google.com/gsi/client"
        async
        defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#8E0000,#C62828);

}

.login-box{

width:420px;

background:#fff;

padding:40px;

border-radius:16px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

text-align:center;

}

.logo{

width:110px;

margin-bottom:20px;

}

h2{

margin-bottom:8px;

color:#C62828;

}

.subtitle{

color:#666;

margin-bottom:30px;

}

#googleSignIn{

display:flex;

justify-content:center;

margin-top:25px;

}

.footer{

margin-top:35px;

font-size:13px;

color:#888;

}

.version{

margin-top:10px;

font-size:12px;

color:#999;

}

</style>

</head>

<body>

<div class="login-box">

<img src="assets/logo.png"
     class="logo"
     alt="Bal Jyoti Public School">

<h2>BJ ONE ERP</h2>

<p class="subtitle">

Bal Jyoti Public School

<br>

Enterprise Resource Planning

</p>

<div id="googleSignIn"></div>

<div class="footer">

Please sign in using your

authorized Google Workspace account.

</div>

<div class="version">

Version 4.0.0

</div>

</div>

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
