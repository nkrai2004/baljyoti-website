<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BJ ONE ERP Dashboard</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="header">

    <div class="header-left">

        <img src="assets/logo.png"
             class="logo"
             alt="BJ ONE ERP">

        <div class="school-name">

            BJ ONE ERP

        </div>

    </div>

    <button class="logout"
            onclick="App.logout()">

        Logout

    </button>

</header>


<div class="container">

    <aside class="sidebar">

        <h3>Modules</h3>

        <ul id="sidebarMenu"
            class="menu">

        </ul>

    </aside>


    <main class="content">

        <!-- THIS DIV IS REPLACED BY MODULES -->

        <div id="mainContent">

            <div class="page-title">

                Dashboard

            </div>

            <div id="welcomeUser"
                 style="margin-bottom:25px;font-size:18px;">

            </div>


            <div class="cards">

                <div class="card">

                    <div class="card-title">

                        Total Students

                    </div>

                    <div class="card-value">

                        0

                    </div>

                </div>


                <div class="card">

                    <div class="card-title">

                        Admissions Today

                    </div>

                    <div class="card-value">

                        0

                    </div>

                </div>


                <div class="card">

                    <div class="card-title">

                        Staff

                    </div>

                    <div class="card-value">

                        0

                    </div>

                </div>


                <div class="card">

                    <div class="card-title">

                        Fee Collection

                    </div>

                    <div class="card-value">

                        ₹0

                    </div>

                </div>

            </div>


            <div class="section">

                <h3>

                    Welcome to BJ ONE ERP

                </h3>

                <br>

                <p>

                    Select a module from the left menu to begin working.

                </p>

            </div>

        </div>

    </main>

</div>


<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/app.js"></script>

</body>

</html>
