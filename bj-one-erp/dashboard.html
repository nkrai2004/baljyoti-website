<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJ ONE ERP | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}body{background:#f5f5f5}.header{height:70px;background:#C62828;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 25px}.header-left{display:flex;align-items:center;gap:15px}.logo{width:45px;height:45px;border-radius:50%;background:#fff;padding:4px}.logout{padding:10px 20px;border:none;border-radius:6px;color:#C62828;font-weight:600}.container{display:flex}.sidebar{width:240px;background:#8E0000;color:#fff;padding:20px}.menu{list-style:none}.menu li{padding:10px}.content{flex:1;padding:30px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1)}.value{font-size:32px;color:#C62828;font-weight:700}
</style>
</head>
<body>
<div class="header"><div class="header-left"><img src="/logo.png" class="logo"><h2>BJ ONE ERP</h2></div><button class="logout" onclick="App.logout()">Logout</button></div>
<div class="container">
<div class="sidebar"><ul class="menu"><li>Dashboard</li><li>Students</li><li>Admissions</li><li>Staff</li><li>Attendance</li><li>Fees</li><li>Transport</li><li>Library</li><li>Reports</li><li>Settings</li></ul></div>
<div class="content">
<h1>Dashboard</h1>
<div class="cards">
<div class="card"><h4>Total Students</h4><div id="students" class="value">0</div></div>
<div class="card"><h4>Total Staff</h4><div id="staff" class="value">0</div></div>
<div class="card"><h4>Today's Attendance</h4><div id="attendance" class="value">0%</div></div>
<div class="card"><h4>Today's Fee Collection</h4><div id="fees" class="value">₹0</div></div>
</div>
</div></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
