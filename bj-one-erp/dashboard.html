</div>

</div>

<!-- Configuration -->
<script src="config.js"></script>

<!-- API -->
<script src="api.js"></script>

<script>

/*=========================================================
BJ ONE ERP Dashboard
=========================================================*/

async function loadDashboard(){

    try{

        const data = await API.getDashboardData();

        if(!data){

            alert("Unable to load dashboard data.");

            return;

        }

        // Convert Sheet rows into an object
        let dashboard = {};

        for(let i=1;i<data.length;i++){

            dashboard[data[i][0]] = data[i][1];

        }

        document.getElementById("students").innerHTML =
            dashboard.TotalStudents || 0;

        document.getElementById("staff").innerHTML =
            dashboard.TotalStaff || 0;

        document.getElementById("attendance").innerHTML =
            (dashboard.TodayAttendance || 0) + "%";

        document.getElementById("fees").innerHTML =
            "₹" + (dashboard.FeeCollectionToday || 0);

        console.log("Dashboard Loaded Successfully");

        console.table(dashboard);

    }

    catch(error){

        console.error(error);

        alert("Dashboard Loading Failed");

    }

}

/*-----------------------------------------
Check Login
------------------------------------------*/

function checkLogin(){

    const token = sessionStorage.getItem("google_token");

    if(!token){

        alert("Please login first.");

        window.location.href="login.html";

        return;

    }

}

/*-----------------------------------------
Logout
------------------------------------------*/

function logout(){

    if(confirm("Do you want to logout?")){

        sessionStorage.clear();

        window.location.href="login.html";

    }

}

<button class="logout" onclick="App.logout()">
    Logout
</button>
/*-----------------------------------------
Start Dashboard
------------------------------------------*/

window.onload = function(){

    checkLogin();

    loadDashboard();

};

</script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>

</body>

</html>
