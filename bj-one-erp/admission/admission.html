<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BJ ONE ERP | Admission CRM</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="../style.css">

<link rel="stylesheet"
      href="admission.css">

</head>

<body>

<div class="page">

    <div class="page-header">

        <div>
            <div class="page-title">Admission CRM Dashboard</div>
            <div class="page-subtitle">
                Manage Leads • Walk-ins • Admissions
            </div>
        </div>

        <div class="actions">

            <button id="newLeadBtn">
                <span class="material-icons">person_add</span>
                New Lead
            </button>

            <button id="walkinBtn">
                <span class="material-icons">store</span>
                Walk-in
            </button>

        </div>

    </div>

    <div class="widget-grid">

        <div class="widget">
            <div class="widget-title">Today's Leads</div>
            <div class="widget-value" id="todayLeads">0</div>
        </div>

        <div class="widget">
            <div class="widget-title">Today's Follow-ups</div>
            <div class="widget-value" id="todayFollowup">0</div>
        </div>

        <div class="widget">
            <div class="widget-title">Walk-ins Today</div>
            <div class="widget-value" id="walkins">0</div>
        </div>

        <div class="widget">
            <div class="widget-title">Applications</div>
            <div class="widget-value" id="applications">0</div>
        </div>

        <div class="widget">
            <div class="widget-title">Admissions</div>
            <div class="widget-value" id="admissions">0</div>
        </div>

        <div class="widget">
            <div class="widget-title">Pending Documents</div>
            <div class="widget-value" id="documents">0</div>
        </div>

    </div>

    <div class="content-grid">

        <div class="card">

            <h3>Recent Leads</h3>

            <table>

                <thead>

                    <tr>
                        <th>Lead ID</th>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Status</th>
                        <th>Counsellor</th>
                    </tr>

                </thead>

                <tbody id="leadTable">

                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="card">

            <h3>Today's Tasks</h3>

            <div id="taskList">

                <div class="task">
                    No pending tasks.
                </div>

            </div>

        </div>

    </div>

</div>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../js/admission.js"></script>

</body>
</html>
