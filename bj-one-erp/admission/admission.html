<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admission CRM | BJ ONE ERP</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
    margin:0;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.page{

    padding:25px;

}

.page-header{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;

}

.page-title{

    font-size:28px;
    font-weight:bold;

}

.actions button{

    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#1E88E5;
    color:#fff;
    margin-left:10px;

}

.widget-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;

}

.widget{

    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.widget-title{

    color:#666;
    font-size:14px;

}

.widget-value{

    font-size:34px;
    font-weight:bold;
    margin-top:8px;

}

.content-grid{

    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;

}

.card{

    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

table{

    width:100%;
    border-collapse:collapse;

}

th,td{

    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;

}

th{

    background:#fafafa;

}

.task{

    padding:10px;
    border-bottom:1px solid #eee;

}

</style>

</head>

<body>

<div class="page">

<div class="page-header">

<div>

<div class="page-title">

Admission CRM Dashboard

</div>

<div>

Manage Leads • Walk-ins • Admissions

</div>

</div>

<div class="actions">

<button id="newLeadBtn">

<span class="material-icons">person_add</span>

New Lead

</button>

<button id="walkinBtn">

<span class="material-icons">store</span>

Walk-in

</button>

</div>

</div>

<div class="widget-grid">

<div class="widget">

<div class="widget-title">

Today's Leads

</div>

<div class="widget-value" id="todayLeads">

0

</div>

</div>

<div class="widget">

<div class="widget-title">

Today's Follow-ups

</div>

<div class="widget-value" id="todayFollowup">

0

</div>

</div>

<div class="widget">

<div class="widget-title">

Walk-ins Today

</div>

<div class="widget-value" id="walkins">

0

</div>

</div>

<div class="widget">

<div class="widget-title">

Applications

</div>

<div class="widget-value" id="applications">

0

</div>

</div>

<div class="widget">

<div class="widget-title">

Admissions

</div>

<div class="widget-value" id="admissions">

0

</div>

</div>

<div class="widget">

<div class="widget-title">

Pending Documents

</div>

<div class="widget-value" id="documents">

0

</div>

</div>

</div>

<div class="content-grid">

<div class="card">

<h3>Recent Leads</h3>

<table>

<thead>

<tr>

<th>Lead ID</th>

<th>Student</th>

<th>Class</th>

<th>Status</th>

<th>Counsellor</th>

</tr>

</thead>

<tbody id="leadTable">

<tr>

<td colspan="5">

No Data

</td>

</tr>

</tbody>

</table>

</div>

<div class="card">

<h3>Today's Tasks</h3>

<div id="taskList">

<div class="task">

No pending tasks.

</div>

</div>

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admission.js"></script>

</body>
</html>
