<div class="module-container">

    <div class="page-title">
        Student Admission
    </div>

    <div class="section">

        <form id="admissionForm">

            <div class="grid-2">

                <div class="form-group">
                    <label>Admission No.</label>
                    <input type="text"
                           id="admissionNo"
                           readonly>
                </div>

                <div class="form-group">
                    <label>Admission Date</label>
                    <input type="date"
                           id="admissionDate">
                </div>

                <div class="form-group">
                    <label>Student Name *</label>
                    <input type="text"
                           id="studentName"
                           required>
                </div>

                <div class="form-group">
                    <label>Gender *</label>

                    <select id="gender">

                        <option value="">Select</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date"
                           id="dob">
                </div>

                <div class="form-group">
                    <label>Class</label>

                    <select id="studentClass">

                        <option>Nursery</option>
                        <option>LKG</option>
                        <option>UKG</option>

                        <option>I</option>
                        <option>II</option>
                        <option>III</option>
                        <option>IV</option>
                        <option>V</option>
                        <option>VI</option>
                        <option>VII</option>
                        <option>VIII</option>
                        <option>IX</option>
                        <option>X</option>
                        <option>XI</option>
                        <option>XII</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Father's Name</label>
                    <input type="text"
                           id="fatherName">
                </div>

                <div class="form-group">
                    <label>Mother's Name</label>
                    <input type="text"
                           id="motherName">
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel"
                           id="mobile">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           id="email">
                </div>

            </div>

            <div class="form-group">

                <label>Address</label>

                <textarea id="address"
                          rows="3"></textarea>

            </div>

            <div class="form-group">

                <label>Student Photograph</label>

                <input type="file"
                       id="photo"
                       accept="image/*">

            </div>

            <div class="mt-20">

                <button type="button"
                        class="btn"
                        onclick="Admission.save()">

                    Save Admission

                </button>

                <button type="reset"
                        class="btn btn-secondary">

                    Reset

                </button>

            </div>

        </form>

    </div>

    <div class="section">

        <h3>Recent Admissions</h3>

        <table id="admissionTable">

            <thead>

                <tr>

                    <th>Admission No.</th>

                    <th>Name</th>

                    <th>Class</th>

                    <th>Mobile</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>
