<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panoramic GPS & Timestamp Camera</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .live-overlay {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.4;
      border-left: 3px solid var(--accent-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .controls-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    button {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    button.btn-danger {
      background: #ef4444;
    }

    button.btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }

    .stitch-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dots-container {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #475569;
      transition: background 0.3s ease;
    }

    .dot.active {
      background: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-color);
    }

    .output-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: none;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .action-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .download-link, .upload-btn, .maps-btn {
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
      transition: background 0.2s;
    }

    .download-link:hover, .upload-btn:hover:not(:disabled), .maps-btn:hover {
      background: #1d4ed8;
    }

    #statusMessage {
      font-size: 0.85rem;
      font-weight: 600;
    }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>📷 GeoPano Cam</h1>
    <p class="subtitle">Capture Panoramic Photos with Live GPS & Google Maps Integration</p>
  </header>

  <div class="app-container">
    <div class="viewfinder-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="live-overlay" id="liveOverlay">
        <div>GPS: Acquiring signal...</div>
        <div>TIME: --</div>
      </div>
    </div>

    <div class="controls-card">
      <div class="btn-group">
        <button id="snapSingleBtn">📷 1-Click Wide Panorama</button>
        <button id="stitchBtn">🧩 3-Shot Panorama Stitch</button>
        <button id="resetBtn" class="btn-danger" disabled>🔄 Reset</button>
      </div>

      <div class="stitch-status">
        <span>Stitch Progress:</span>
        <div class="dots-container">
          <span class="dot" id="dot1"></span>
          <span class="dot" id="dot2"></span>
          <span class="dot" id="dot3"></span>
        </div>
      </div>
    </div>

    <div class="output-section">
      <canvas id="photoCanvas"></canvas>
      <div class="action-links">
        <a id="downloadLink" class="download-link" download="panorama_geotagged.jpg">⬇️ Download Photo</a>
        <a id="mapsBtn" class="maps-btn" target="_blank" style="background:#ea4335;">📍 View in Google Maps</a>
        <button id="uploadBtn" class="upload-btn" style="background:#8b5cf6;">☁️ Save to Sheet & Drive</button>
      </div>
      <div id="statusMessage"></div>
    </div>
  </div>

  <footer>
    Requires HTTPS or localhost for Camera & GPS access. Hosted on GitHub Pages.
  </footer>

  <script>
    // ----------------------------------------------------
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww-2249vQYCB-GafsJeM8zE0JW4RyFKe8Y_C1PlxZPwRt1vvDnKeFQaq6fhEXahvN_Vg/exec";
    // ----------------------------------------------------

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');
    const liveOverlay = document.getElementById('liveOverlay');
    const downloadLink = document.getElementById('downloadLink');
    const mapsBtn = document.getElementById('mapsBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMessage = document.getElementById('statusMessage');

    const snapSingleBtn = document.getElementById('snapSingleBtn');
    const stitchBtn = document.getElementById('stitchBtn');
    const resetBtn = document.getElementById('resetBtn');

    let currentLat = "N/A";
    let currentLon = "N/A";
    let currentAcc = "N/A";
    let capturedFrames = [];
    let currentImageDataURL = "";

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera error: " + err.message + "\nEnsure camera permissions are granted.");
      }
    }

    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude.toFixed(6);
            currentLon = pos.coords.longitude.toFixed(6);
            currentAcc = Math.round(pos.coords.accuracy);
            updateOverlayText();
          },
          (err) => {
            currentLat = "Unavailable";
            currentLon = "Unavailable";
            updateOverlayText();
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function updateOverlayText() {
      const now = new Date();
      const timeStr = now.toLocaleDateString() + " " + now.toLocaleTimeString();
      liveOverlay.innerHTML = `
        <div>LAT: ${currentLat} | LON: ${currentLon} (±${currentAcc}m)</div>
        <div>TIME: ${timeStr}</div>
      `;
    }
    setInterval(updateOverlayText, 1000);

    function drawOverlayOnCanvas(targetCtx, width, height) {
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toTimeString().split(' ')[0];
      
      const line1 = `GPS: ${currentLat}, ${currentLon} (Acc: ±${currentAcc}m)`;
      const line2 = `DATE: ${dateStr}  TIME: ${timeStr}`;

      const fontSize = Math.max(16, Math.floor(height * 0.038));
      targetCtx.font = `bold ${fontSize}px ui-monospace, monospace`;
      
      const padding = fontSize * 0.5;
      const textWidth = Math.max(
        targetCtx.measureText(line1).width,
        targetCtx.measureText(line2).width
      );
      const boxWidth = textWidth + (padding * 2);
      const boxHeight = (fontSize * 2.3) + (padding * 2);

      const x = padding * 1.5;
      const y = height - boxHeight - (padding * 1.5);

      targetCtx.fillStyle = "rgba(15, 23, 42, 0.85)";
      targetCtx.beginPath();
      targetCtx.roundRect(x, y, boxWidth, boxHeight, 8);
      targetCtx.fill();

      targetCtx.strokeStyle = "#10b981";
      targetCtx.lineWidth = 2;
      targetCtx.stroke();

      targetCtx.fillStyle = "#10b981";
      targetCtx.fillText(line1, x + padding, y + padding + fontSize);
      targetCtx.fillStyle = "#ffffff";
      targetCtx.fillText(line2, x + padding, y + padding + (fontSize * 2.1));
    }

    snapSingleBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      
      const targetHeight = Math.floor(vWidth * (9 / 21));
      const startY = Math.floor((vHeight - targetHeight) / 2);

      canvas.width = vWidth;
      canvas.height = targetHeight;

      ctx.drawImage(video, 0, startY, vWidth, targetHeight, 0, 0, vWidth, targetHeight);
      drawOverlayOnCanvas(ctx, vWidth, targetHeight);
      finalizeCapture();
    });

    stitchBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;
      if (capturedFrames.length < 3) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, 0, 0);

        capturedFrames.push(tempCanvas);
        document.getElementById(`dot${capturedFrames.length}`).classList.add('active');
        resetBtn.disabled = false;

        if (capturedFrames.length === 3) {
          stitchFrames();
        }
      }
    });

    function stitchFrames() {
      const singleW = capturedFrames[0].width;
      const singleH = capturedFrames[0].height;
      const overlap = Math.floor(singleW * 0.15);
      const totalWidth = (singleW * 3) - (overlap * 2);

      canvas.width = totalWidth;
      canvas.height = singleH;

      ctx.drawImage(capturedFrames[0], 0, 0);
      ctx.drawImage(capturedFrames[1], singleW - overlap, 0);
      ctx.drawImage(capturedFrames[2], (singleW - overlap) * 2, 0);

      drawOverlayOnCanvas(ctx, totalWidth, singleH);
      finalizeCapture();
      resetStitch();
    }

    function resetStitch() {
      capturedFrames = [];
      document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));
      resetBtn.disabled = true;
    }

    resetBtn.addEventListener('click', resetStitch);

    function finalizeCapture() {
      canvas.style.display = 'block';
      currentImageDataURL = canvas.toDataURL('image/jpeg', 0.90);
      
      downloadLink.href = currentImageDataURL;
      downloadLink.style.display = 'inline-block';

      // Set up Google Maps location URL
      if (currentLat !== "N/A" && currentLat !== "Unavailable") {
        const googleMapsUrl = `https://www.google.com/maps?q=${currentLat},${currentLon}`;
        mapsBtn.href = googleMapsUrl;
        mapsBtn.style.display = 'inline-block';
      }

      uploadBtn.style.display = 'inline-block';
      statusMessage.textContent = '';
      
      downloadLink.scrollIntoView({ behavior: 'smooth' });
    }

    uploadBtn.addEventListener('click', async () => {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("Yhttps://script.google.com/macros/s/AKfycbww-2249vQYCB-GafsJeM8zE0JW4RyFKe8Y_C1PlxZPwRt1vvDnKeFQaq6fhEXahvN_Vg/exec")) {
        alert("Please set up the Google Apps Script Web App URL inside the index.html code.");
        return;
      }

      uploadBtn.disabled = true;
      statusMessage.style.color = "#38bdf8";
      statusMessage.textContent = "⏳ Uploading photo to Google Drive & saving location to Google Sheet...";

      const mapsUrl = `https://www.google.com/maps?q=${currentLat},${currentLon}`;

      const payload = {
        timestamp: new Date().toISOString(),
        latitude: currentLat,
        longitude: currentLon,
        accuracy: currentAcc,
        mapsUrl: mapsUrl,
        image: currentImageDataURL
      };

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.result === "success") {
          statusMessage.style.color = "#10b981";
          statusMessage.textContent = "✅ Saved to Google Sheet & Drive with Google Maps link!";
        } else {
          throw new Error(result.message || "Unknown error occurred.");
        }
      } catch (err) {
        statusMessage.style.color = "#ef4444";
        statusMessage.textContent = "❌ Upload failed: " + err.message;
      } finally {
        uploadBtn.disabled = false;
      }
    });

    initCamera();
    initGPS();
  </script>
</body>
</html>
