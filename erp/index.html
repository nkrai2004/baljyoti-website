<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bal Jyoti ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6 border border-slate-100">
    <div class="text-center space-y-2">
      <img src="logo.png" alt="Bal Jyoti ERP" class="h-16 mx-auto object-contain">
      <h1 class="text-xl font-bold text-slate-900">Bal Jyoti Educational Portal</h1>
      <p class="text-xs text-slate-500">Sign in with your official @baljyoti.com Google Workspace account</p>
    </div>

    <div id="authAlert" class="hidden p-3.5 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs font-medium space-y-1">
      <div class="font-bold flex items-center space-x-1.5">
        <svg class="w-4 h-4 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <span id="alertTitle">Access Denied</span>
      </div>
      <p id="alertMessage" class="text-slate-600 text-[11px] leading-relaxed"></p>
    </div>

    <button onclick="signInWithGoogle()" id="loginBtn" class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center justify-center space-x-3 transition shadow-lg active:scale-[0.99]">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
      </svg>
      <span id="loginBtnText">Sign in with Google Workspace</span>
    </button>

    <div class="pt-4 border-t border-slate-100 text-center">
      <p class="text-[11px] text-slate-400">Zero-Trust Access Control System • Bal Jyoti IT Ops</p>
    </div>
  </div>

  <script>
    const SUPER_ADMIN_EMAIL = "info@baljyoti.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhSwScGcBlRSqrkyT-bfog22RL3z_YGMY8vwriNRNP5q4P7DqWhh-TKnz40L_BwCVp8w/exec";

    const firebaseConfig = {
      apiKey: "AIzaSyB0q4FwgnTHLgfvllSyi7unGDCIGLkqpJI",
      authDomain: "baljyoti-portal.firebaseapp.com",
      projectId: "baljyoti-portal",
      storageBucket: "baljyoti-portal.firebasestorage.app",
      messagingSenderId: "420727507952",
      appId: "1:420727507952:web:de5bdbb73521b9fae4eb35"
    };

    firebase.initializeApp(firebaseConfig);

    // Auto-redirect if already signed in
    firebase.auth().onAuthStateChanged((user) => {
      if (user && user.email.endsWith("@baljyoti.com")) {
        verifyAndRedirectUser(user.email);
      }
    });

    function signInWithGoogle() {
      setLoadingState(true);
      hideError();

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ 
        hd: "baljyoti.com",
        prompt: "select_account"
      });

      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          const email = result.user.email;
          if (!email.endsWith("@baljyoti.com")) {
            firebase.auth().signOut();
            showError("Unauthorized Domain", "Only official @baljyoti.com Google Workspace accounts are permitted.");
            setLoadingState(false);
            return;
          }
          verifyAndRedirectUser(email);
        })
        .catch((error) => {
          setLoadingState(false);
          if (error.code !== "auth/popup-closed-by-user") {
            showError("Authentication Error", error.message);
          }
        });
    }

    function verifyAndRedirectUser(email) {
      // 1. Super Admin Direct Bypass
      if (email === SUPER_ADMIN_EMAIL) {
        sessionStorage.setItem("userPermissions", JSON.stringify({
          status: "SUCCESS",
          email: email,
          role: "SUPER_ADMIN",
          modules: { sis: true, finance: true, academics: true, adminOps: true }
        }));
        window.location.href = "dashboard.html";
        return;
      }

      // 2. Fetch User RBAC Permission State from Backend
      fetch(`${SCRIPT_URL}?action=get_user_permissions&email=${encodeURIComponent(email)}`)
        .then((res) => res.json())
        .then((data) => {
          if (data.status === "SUCCESS" && data.role !== "NO_ACCESS") {
            sessionStorage.setItem("userPermissions", JSON.stringify(data));
            window.location.href = "dashboard.html";
          } else {
            firebase.auth().signOut();
            showError(
              "Account Not Provisioned",
              "Your Google Workspace account has ZERO module permissions. Please request access from info@baljyoti.com."
            );
            setLoadingState(false);
          }
        })
        .catch((err) => {
          console.error("RBAC Verification Error:", err);
          window.location.href = "dashboard.html";
        });
    }

    function setLoadingState(isLoading) {
      const btn = document.getElementById("loginBtn");
      const btnText = document.getElementById("loginBtnText");
      if (isLoading) {
        btn.disabled = true;
        btn.classList.add("opacity-75", "cursor-not-allowed");
        btnText.innerText = "Verifying Workspace Permissions...";
      } else {
        btn.disabled = false;
        btn.classList.remove("opacity-75", "cursor-not-allowed");
        btnText.innerText = "Sign in with Google Workspace";
      }
    }

    function showError(title, message) {
      const alertBox = document.getElementById("authAlert");
      document.getElementById("alertTitle").innerText = title;
      document.getElementById("alertMessage").innerText = message;
      alertBox.classList.remove("hidden");
    }

    function hideError() {
      document.getElementById("authAlert").classList.add("hidden");
    }
  </script>
</body>
</html>
