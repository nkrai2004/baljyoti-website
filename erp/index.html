<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Workspace SSO | ERP Portal</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      text-align: center;
    }

    .google-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }

    .auth-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .auth-card p {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    .google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .custom-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background-color: #ffffff;
      color: #1f2937;
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .custom-google-btn:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    .form-group {
      text-align: left;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    select, input[type="email"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #0f172a;
      outline: none;
      background-color: #ffffff;
    }

    select:focus, input[type="email"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.825rem;
      margin-bottom: 18px;
      text-align: left;
      display: none;
    }

    .alert-danger {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .alert-info {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0 16px 0;
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #e2e8f0;
    }

    .divider span {
      padding: 0 10px;
    }

    .footer-note {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <svg class="google-logo" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>

    <h1>Sign in with Google</h1>
    <p>Google Workspace Single Sign-On (SSO)</p>

    <div id="alertBox" class="alert"></div>

    <!-- Official Google Identity Button Mount -->
    <div id="g_id_onload"
      data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
      data-context="signin"
      data-ux_mode="popup"
      data-callback="handleGoogleCredentialResponse"
      data-auto_prompt="false">
    </div>

    <div class="google-btn-container">
      <div class="g_id_signin"
        data-type="standard"
        data-shape="rectangular"
        data-theme="outline"
        data-text="signin_with"
        data-size="large"
        data-logo_alignment="left"
        data-width="360">
      </div>
    </div>

    <div class="divider">
      <span>Or Enterprise Workspace Auth</span>
    </div>

    <!-- Workspace Account Authentication Simulator -->
    <form id="authForm" onsubmit="handleWorkspaceAuth(event)">
      <div class="form-group">
        <label for="userEmail">Google Workspace Email</label>
        <input type="email" id="userEmail" placeholder="admin@domain.com" required>
      </div>

      <div class="form-group">
        <label for="roleScope">Target Role Scope (RBAC Enforcement)</label>
        <select id="roleScope">
          <option value="Super Admin">Super Admin</option>
          <option value="Admin">Admin</option>
          <option value="Teacher">Teacher</option>
          <option value="Student">Student</option>
          <option value="Staff">Staff</option>
        </select>
      </div>

      <button type="submit" class="custom-google-btn" style="background-color: #2563eb; color: #ffffff; border: none;">
        Authenticate Workspace Account
      </button>
    </form>

    <div class="footer-note">
      Google Workspace OAuth 2.0 &bull; RBAC Policy Enforced
    </div>
  </div>

  <script>
    const REDIRECT_TARGET = "dashboard.html";

    function checkExistingSession() {
      const sessionData = localStorage.getItem("erp_active_session");
      if (sessionData) {
        try {
          const auth = JSON.parse(sessionData);
          if (auth && auth.isAuthenticated) {
            window.location.href = REDIRECT_TARGET;
          }
        } catch (e) {
          localStorage.removeItem("erp_active_session");
        }
      }
    }

    function showAlert(message, type = "danger") {
      const alertBox = document.getElementById("alertBox");
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = "block";
    }

    // Google Identity Services JWT Callback
    function handleGoogleCredentialResponse(response) {
      try {
        const payload = parseJwt(response.credential);
        const email = payload.email;
        
        // Resolve RBAC role from local matrix or fallback
        const assignedRoles = JSON.parse(localStorage.getItem("user_role_assignments") || "{}");
        const userRole = assignedRoles[email] || "Super Admin";

        establishSession(email, userRole, "google_oauth_gis");
      } catch (err) {
        showAlert("Google Authentication failed: " + err.message);
      }
    }

    function handleWorkspaceAuth(event) {
      event.preventDefault();
      const email = document.getElementById("userEmail").value.trim();
      const roleScope = document.getElementById("roleScope").value;

      if (!email) {
        showAlert("Please enter a valid Google Workspace email.");
        return;
      }

      const assignedRoles = JSON.parse(localStorage.getItem("user_role_assignments") || "{}");
      const activeRole = assignedRoles[email] || roleScope;

      establishSession(email, activeRole, "workspace_sso");
    }

    function establishSession(email, role, provider) {
      const authSession = {
        email: email,
        role: role,
        provider: provider,
        isAuthenticated: true,
        authenticatedAt: new Date().toISOString()
      };

      localStorage.setItem("erp_active_session", JSON.stringify(authSession));
      showAlert("Google Authentication successful! Redirecting...", "info");

      setTimeout(() => {
        window.location.href = REDIRECT_TARGET;
      }, 600);
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    window.addEventListener("DOMContentLoaded", checkExistingSession);
  </script>
</body>
</html>
