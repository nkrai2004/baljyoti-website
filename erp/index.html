<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Google Workspace ERP Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      background-color: #2563eb;
      color: white;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
    }

    .brand-header p {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #0f172a;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.825rem;
      margin-bottom: 18px;
      display: none;
    }

    .alert-danger {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .alert-info {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">ERP</div>
      <h1>Workspace ERP Portal</h1>
      <p>Authenticate to access system modules</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Workspace Email</label>
        <input type="email" id="email" required placeholder="admin@domain.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="role">Role (RBAC Session Scope)</label>
        <select id="role">
          <option value="Super Admin">Super Admin</option>
          <option value="Admin">Admin</option>
          <option value="Teacher">Teacher</option>
          <option value="Student">Student</option>
          <option value="Staff">Staff</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <div class="footer-note">
      Protected by Google Workspace RBAC Policy &bull; Session Isolation Active
    </div>
  </div>

  <script>
    const REDIRECT_TARGET = "dashboard.html";

    function checkActiveSession() {
      const session = localStorage.getItem("erp_active_session");
      if (session) {
        try {
          const auth = JSON.parse(session);
          if (auth && auth.isAuthenticated) {
            window.location.href = REDIRECT_TARGET;
          }
        } catch (e) {
          localStorage.removeItem("erp_active_session");
        }
      }
    }

    function showAlert(message, type = "danger") {
      const alertBox = document.getElementById("alertBox");
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.style.display = "block";
    }

    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const submitBtn = document.getElementById("submitBtn");

      if (!email || !password) {
        showAlert("Please provide both email and password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Authenticating...";

      const assignedRoles = JSON.parse(localStorage.getItem("user_role_assignments") || "{}");
      const activeRole = assignedRoles[email] || role;

      const authSession = {
        email: email,
        role: activeRole,
        isAuthenticated: true,
        authenticatedAt: new Date().toISOString()
      };

      localStorage.setItem("erp_active_session", JSON.stringify(authSession));

      showAlert("Authentication successful! Redirecting...", "info");

      setTimeout(() => {
        window.location.href = REDIRECT_TARGET;
      }, 600);
    }

    window.addEventListener("DOMContentLoaded", checkActiveSession);
  </script>
</body>
</html>
