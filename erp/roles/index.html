<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Roles & Permissions - Baljyoti ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; color: #111827; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }

    .header-bar { width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #dc2626; padding-bottom: 12px; margin-bottom: 20px; }
    .back-btn { color: #dc2626; text-decoration: none; font-weight: 800; font-size: 14px; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: 800; color: #dc2626; text-transform: uppercase; }

    .container { width: 100%; max-width: 900px; }

    .loading-box { text-align: center; padding: 40px; font-weight: 700; color: #dc2626; }

    .user-card { background: #ffffff; border: 1.5px solid #dc2626; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.05); }
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .user-name { font-size: 16px; font-weight: 800; color: #111827; }
    .user-email { font-size: 13px; color: #4b5563; font-weight: 600; }

    .role-select { padding: 6px 12px; border: 1.5px solid #dc2626; border-radius: 6px; font-weight: 700; color: #dc2626; background: #ffffff; outline: none; }

    .modules-title { font-size: 11px; font-weight: 800; color: #dc2626; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .modules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }

    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; background: #fff5f5; padding: 8px 10px; border-radius: 6px; border: 1px solid #fee2e2; cursor: pointer; }
    .checkbox-label input { accent-color: #dc2626; width: 16px; height: 16px; }

    .btn-save { background: #dc2626; color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .access-denied { text-align: center; color: #dc2626; font-weight: 800; padding: 40px; background: #fff5f5; border: 2px solid #dc2626; border-radius: 12px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="header-bar">
    <a href="../" class="back-btn">← Back</a>
    <div class="title">User Roles & Permissions</div>
    <div></div>
  </div>

  <div class="container" id="mainContainer">
    <div class="loading-box" id="loadingBox">⌛ Fetching user directory from Google Workspace...</div>
    <div id="usersList"></div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxssOtDC3K9nvqGTtuiBrpGwjhRCT3ap1Z9DbqJW5B7ff9bAXnN3XDX4_OmUfzWfKQlZw/exec";

  const firebaseConfig = {
    apiKey: "AIzaSyB0q4FwgnTHLgfvllSyi7unGDCIGLkqpJI",
    authDomain: "baljyoti-portal.firebaseapp.com",
    projectId: "baljyoti-portal",
    storageBucket: "baljyoti-portal.firebasestorage.app",
    messagingSenderId: "420727507952",
    appId: "1:420727507952:web:de5bdbb73521b9fae4eb35"
  };
  firebase.initializeApp(firebaseConfig);

  let currentUser = null;

  firebase.auth().onAuthStateChanged((user) => {
    if (user && user.email.endsWith("@baljyoti.com")) {
      currentUser = user;
      
      // Super Admin Safeguard Check
      if (user.email.toLowerCase() === "info@baljyoti.com") {
        fetchDirectoryUsers();
      } else {
        document.getElementById("mainContainer").innerHTML = `
          <div class="access-denied">
            🔒 ACCESS RESTRICTED<br><br>
            Only Super Admin (info@baljyoti.com) can access User Roles Management.
          </div>
        `;
      }
    } else {
      window.location.href = "../";
    }
  });

  function fetchDirectoryUsers() {
    fetch(SCRIPT_URL + "?action=get_users")
      .then(res => res.json())
      .then(data => {
        document.getElementById("loadingBox").style.display = "none";
        if (data.status === "success") {
          renderUserList(data.users);
        } else {
          document.getElementById("usersList").innerHTML = `<div class="loading-box">Error loading users: ${data.message}</div>`;
        }
      })
      .catch(err => {
        document.getElementById("loadingBox").style.display = "none";
        document.getElementById("usersList").innerHTML = `<div class="loading-box">Failed to connect to backend server.</div>`;
      });
  }

  function renderUserList(users) {
    const listEl = document.getElementById("usersList");
    listEl.innerHTML = "";

    users.forEach((u, idx) => {
      const card = document.createElement("div");
      card.className = "user-card";

      const hasAttendance = u.modules.includes("attendance");
      const hasDutyReport = u.modules.includes("duty_report");

      card.innerHTML = `
        <div class="user-header">
          <div>
            <div class="user-name">${u.name}</div>
            <div class="user-email">${u.email}</div>
          </div>
          <div>
            <select class="role-select" id="role-${idx}">
              <option value="Staff" ${u.role === 'Staff' ? 'selected' : ''}>Staff</option>
              <option value="Teacher" ${u.role === 'Teacher' ? 'selected' : ''}>Teacher</option>
              <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>Admin</option>
            </select>
          </div>
        </div>

        <div class="modules-title">Module Access Permissions</div>
        <div class="modules-grid">
          <label class="checkbox-label">
            <input type="checkbox" id="mod-att-${idx}" ${hasAttendance ? 'checked' : ''}>
            Staff Attendance
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="mod-duty-${idx}" ${hasDutyReport ? 'checked' : ''}>
            Staff Duty Report
          </label>
        </div>

        <div style="text-align: right;">
          <button class="btn-save" id="btn-save-${idx}" onclick="saveUserPermissions('${u.email}', ${idx})">Save Permissions</button>
        </div>
      `;

      listEl.appendChild(card);
    });
  }

  function saveUserPermissions(targetEmail, idx) {
    const btn = document.getElementById(`btn-save-${idx}`);
    const selectedRole = document.getElementById(`role-${idx}`).value;
    
    const modules = [];
    if (document.getElementById(`mod-att-${idx}`).checked) modules.push("attendance");
    if (document.getElementById(`mod-duty-${idx}`).checked) modules.push("duty_report");

    btn.disabled = true;
    btn.innerText = "Saving...";

    const payload = {
      action: "save_permissions",
      targetEmail: targetEmail,
      role: selectedRole,
      modules: modules
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(() => {
      alert(`Permissions updated for ${targetEmail}`);
      btn.disabled = false;
      btn.innerText = "Save Permissions";
    }).catch(err => {
      alert("Error saving permissions: " + err.message);
      btn.disabled = false;
      btn.innerText = "Save Permissions";
    });
  }
</script>
</body>
</html>
