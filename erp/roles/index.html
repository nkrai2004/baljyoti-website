<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Roles & Permissions - Baljyoti ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #ffffff; color: #111827; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }

    .header-bar { width: 100%; max-width: 768px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #dc2626; padding-bottom: 12px; margin-bottom: 20px; }
    .back-btn { color: #dc2626; text-decoration: none; font-weight: 800; font-size: 14px; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: 800; color: #dc2626; text-transform: uppercase; }

    .container { width: 100%; max-width: 768px; display: flex; flex-direction: column; gap: 20px; }

    .card { background: #ffffff; border: 2px solid #dc2626; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.08); }
    .card-title { font-size: 14px; font-weight: 800; color: #dc2626; text-transform: uppercase; margin-bottom: 14px; letter-spacing: 0.5px; }

    .form-group { margin-bottom: 14px; }
    label { font-size: 12px; font-weight: 800; color: #dc2626; text-transform: uppercase; display: block; margin-bottom: 6px; }
    
    input[type="email"], input[type="text"], select { width: 100%; padding: 12px; border: 1.5px solid #dc2626; border-radius: 8px; font-size: 14px; color: #111827; background: #ffffff; outline: none; }

    .permissions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #111827; }
    .checkbox-item input { accent-color: #dc2626; width: 16px; height: 16px; }

    .btn-submit { background: #dc2626; color: #ffffff; border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 15px; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 14px; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Table Styling */
    .table-container { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #fff5f5; color: #dc2626; font-weight: 800; padding: 10px; border-bottom: 2px solid #dc2626; text-transform: uppercase; }
    td { padding: 10px; border-bottom: 1px solid #e5e7eb; color: #111827; }

    .status-msg { text-align: center; font-weight: 700; color: #dc2626; padding: 20px; font-size: 14px; }
    .hidden { display: none; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="header-bar">
    <a href="../" class="back-btn">← Back</a>
    <div class="title">User Roles & Permissions</div>
    <div></div>
  </div>

  <div class="container">
    
    <!-- Status / Loading Message -->
    <div id="loadingStatus" class="status-msg">Connecting to backend server...</div>

    <!-- Main Content Container -->
    <div id="contentArea" class="hidden">
      
      <!-- Assign Role Card -->
      <div class="card" style="margin-bottom: 20px;">
        <div class="card-title">Assign New User Role</div>
        <form id="roleForm" onsubmit="submitRole(event)">
          
          <div class="form-group">
            <label for="userEmail">Staff Email</label>
            <input type="email" id="userEmail" placeholder="teacher@baljyoti.com" required>
          </div>

          <div class="form-group">
            <label for="userName">Staff Name</label>
            <input type="text" id="userName" placeholder="Full Name" required>
          </div>

          <div class="form-group">
            <label for="userRole">Assigned Role</label>
            <select id="userRole" required>
              <option value="" disabled selected>-- Select Designated Role --</option>
              <option value="Admin">Administrator</option>
              <option value="Teacher">Teacher / Faculty</option>
              <option value="Inspection Officer">Inspection Officer</option>
              <option value="Accountant">Accountant</option>
            </select>
          </div>

          <div class="form-group">
            <label>Module Permissions Access</label>
            <div class="permissions-grid">
              <label class="checkbox-item"><input type="checkbox" name="perm" value="Attendance"> Staff Attendance</label>
              <label class="checkbox-item"><input type="checkbox" name="perm" value="DutyReports"> Duty Reports</label>
              <label class="checkbox-item"><input type="checkbox" name="perm" value="SIS"> SIS / Students</label>
              <label class="checkbox-item"><input type="checkbox" name="perm" value="Finance"> Finance & Fees</label>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Save Permissions</button>
        </form>
      </div>

      <!-- Current Assigned Roles Table -->
      <div class="card">
        <div class="card-title">Current Assigned Roles</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Permissions</th>
              </tr>
            </thead>
            <tbody id="rolesTableBody">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSnRWGUsKQhkXjYbnSj-udkO4IBH6EsjxxgiFwnQZ8zsmGdot8hmlkkuLxKHiLFwJQWQ/exec";

  let currentUser = null;

  const firebaseConfig = {
    apiKey: "AIzaSyB0q4FwgnTHLgfvllSyi7unGDCIGLkqpJI",
    authDomain: "baljyoti-portal.firebaseapp.com",
    projectId: "baljyoti-portal",
    storageBucket: "baljyoti-portal.firebasestorage.app",
    messagingSenderId: "420727507952",
    appId: "1:420727507952:web:de5bdbb73521b9fae4eb35"
  };
  firebase.initializeApp(firebaseConfig);

  firebase.auth().onAuthStateChanged((user) => {
    if (user && user.email.endsWith("@baljyoti.com")) {
      currentUser = user;
      loadRoles();
    } else {
      window.location.href = "../";
    }
  });

  // Fetch Roles via doGet
  function loadRoles() {
    fetch(SCRIPT_URL + "?action=get_roles")
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          document.getElementById("loadingStatus").classList.add("hidden");
          document.getElementById("contentArea").classList.remove("hidden");
          renderRolesTable(res.data);
        } else {
          document.getElementById("loadingStatus").innerText = "Failed to connect to backend server: " + res.message;
        }
      })
      .catch(err => {
        document.getElementById("loadingStatus").innerText = "Failed to connect to backend server.";
      });
  }

  function renderRolesTable(roles) {
    const tbody = document.getElementById("rolesTableBody");
    tbody.innerHTML = "";

    if (!roles || roles.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#6b7280;">No permissions assigned yet.</td></tr>';
      return;
    }

    roles.forEach(item => {
      let perms = [];
      try {
        perms = typeof item.permissions === 'string' ? JSON.parse(item.permissions) : item.permissions;
      } catch(e) {
        perms = [item.permissions];
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${item.email}</strong></td>
        <td>${item.name}</td>
        <td>${item.role}</td>
        <td>${Array.isArray(perms) ? perms.join(", ") : perms}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Save Role via doPost
  function submitRole(e) {
    e.preventDefault();

    const email = document.getElementById("userEmail").value.trim();
    const name = document.getElementById("userName").value.trim();
    const role = document.getElementById("userRole").value;

    const checkedPerms = Array.from(document.querySelectorAll('input[name="perm"]:checked')).map(cb => cb.value);

    if (checkedPerms.length === 0) {
      alert("Please select at least one module permission.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "Saving Role...";

    const payload = {
      action: "save_role",
      email: email,
      name: name,
      role: role,
      permissions: checkedPerms
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(() => {
      alert("User Role Assigned Successfully!");
      document.getElementById("roleForm").reset();
      btn.disabled = false;
      btn.innerText = "Save Permissions";
      loadRoles();
    }).catch(err => {
      alert("Error saving role: " + err.message);
      btn.disabled = false;
      btn.innerText = "Save Permissions";
    });
  }
</script>
</body>
</html>
