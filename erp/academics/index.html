<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baljyoti ERP | Academic & Campus Life</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --accent: #2563eb;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --sidebar-width: 260px;
      --drawer-width: 420px;
      --status-green: #16a34a;
      --status-green-bg: #dcfce7;
      --status-amber: #d97706;
      --status-amber-bg: #fef3c7;
      --status-red: #dc2626;
      --status-red-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; font-size: 14px; }

    /* Left Global Sidebar Rail */
    .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-logo { width: 36px; height: 36px; background: var(--primary); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
    .cmmi-badge { font-size: 9px; background: var(--status-green-bg); color: #15803d; padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }

    .nav-container { flex: 1; overflow-y: auto; padding: 12px 10px; }
    .nav-item { margin-bottom: 4px; }
    .nav-item a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 13px; transition: all 0.15s; }
    .nav-item a:hover, .nav-item.active a { background: var(--primary-light); color: var(--primary); }
    .nav-icon { width: 20px; text-align: center; font-size: 15px; }

    /* Workstation Shell */
    .wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-main); }
    
    /* Topbar Header */
    .topbar { height: 64px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 16px; }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-title { font-size: 16px; font-weight: 800; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
