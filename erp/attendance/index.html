<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baljyoti School - Staff Attendance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #0f172a; margin-bottom: 6px; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .btn { background: #2563eb; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; transition: background 0.2s ease; margin-top: 10px; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    #video, #canvas { width: 100%; border-radius: 12px; margin-top: 15px; background: #000; display: none; }
    .status { margin-top: 18px; font-weight: 600; font-size: 14px; padding: 12px; border-radius: 8px; display: none; line-height: 1.4; }
    .success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .user-info { font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 16px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="card">
  <h2>Baljyoti School</h2>
  <p>Staff Attendance Portal</p>

  <div id="login-section">
    <button class="btn" onclick="googleLogin()">Sign in with @baljyoti.com</button>
  </div>

  <div id="attendance-section" style="display:none;">
    <div class="user-info" id="user-name"></div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <button class="btn" id="snap-btn" onclick="takePhoto()" style="display:none;">Take Selfie</button>
    <button class="btn" id="submit-btn" onclick="submitAttendance()" style="display:none; background:#16a34a;">Mark Attendance</button>
  </div>

  <div id="status-box" class="status"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB0q4FwgnTHLgfvllSyi7unGDCIGLkqpJI",
    authDomain: "baljyoti-portal.firebaseapp.com",
    projectId: "baljyoti-portal",
    storageBucket: "baljyoti-portal.firebasestorage.app",
    messagingSenderId: "420727507952",
    appId: "1:420727507952:web:de5bdbb73521b9fae4eb35"
  };
  firebase.initializeApp(firebaseConfig);

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOUJ6rLiLhbQ_hWBYqFS8Q7NTc_x0gN3lfmBmUu7N-trA4MLqDIYVnWRttb3jBCvvk8A/exec";
  const SCHOOL_LAT = 28.636540;
  const SCHOOL_LNG = 77.468507;
  const MAX_DISTANCE_METERS = 100;

  let currentUser = null;
  let photoBase64 = "";

  firebase.auth().onAuthStateChanged((user) => {
    if (user && user.email.endsWith("@baljyoti.com")) {
      currentUser = user;
      document.getElementById("login-section").style.display = "none";
      document.getElementById("attendance-section").style.display = "block";
      document.getElementById("user-name").innerText = "Welcome, " + currentUser.displayName;
      startCamera();
    }
  });

  function googleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch((error) => {
      if (error.code === 'auth/popup-blocked') {
        firebase.auth().signInWithRedirect(provider);
      } else {
        showStatus("Auth Error: " + error.message, false);
      }
    });
  }

  function startCamera() {
    const video = document.getElementById("video");
    video.style.display = "block";
    
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "user" } } })
    .then((stream) => { 
      video.srcObject = stream; 
      document.getElementById("snap-btn").style.display = "block"; 
      hideStatus();
    })
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then((stream) => {
          video.srcObject = stream;
          document.getElementById("snap-btn").style.display = "block";
          hideStatus();
        })
        .catch(() => {
          showStatus("Camera access permission required. Please allow camera access.", false);
        });
    });
  }

  function takePhoto() {
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    canvas.width = 300; 
    canvas.height = 300;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, 300, 300);
    
    photoBase64 = canvas.toDataURL("image/jpeg", 0.7);
    video.style.display = "none";
    canvas.style.display = "block";
    document.getElementById("snap-btn").style.display = "none";
    document.getElementById("submit-btn").style.display = "block";
    
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
    }
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function logToSheet(distance, status, message, isSuccess) {
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        name: currentUser.displayName,
        email: currentUser.email,
        distance: distance,
        photoBase64: photoBase64,
        status: status
      })
    })
    .then(() => showStatus(message, isSuccess))
    .catch(() => showStatus("Network error recording log.", false));
  }

  function submitAttendance() {
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    showStatus("Checking GPS location...", true);

    navigator.geolocation.getCurrentPosition((pos) => {
      const distance = Math.round(calculateDistance(pos.coords.latitude, pos.coords.longitude, SCHOOL_LAT, SCHOOL_LNG));
      
      if (distance > MAX_DISTANCE_METERS) {
        showStatus(`Failed: You are ${distance}m away (Limit 100m). Recording failed attempt...`, false);
        logToSheet(distance, "FAILED (OUT OF BOUNDS)", `Attempt logged! Outside school bounds (${distance}m away).`, false);
        return;
      }

      showStatus("Logging attendance to Google Sheets...", true);
      logToSheet(distance, "PRESENT", "Attendance Marked Successfully!", true);
      submitBtn.style.display = "none";

    }, () => {
      showStatus("GPS permissions denied. Logging failed attempt...", false);
      logToSheet(0, "FAILED (NO GPS)", "Recorded failed attempt: GPS access was denied.", false);
    }, { enableHighAccuracy: true });
  }

  function showStatus(msg, isSuccess) {
    const box = document.getElementById("status-box");
    box.style.display = "block";
    box.className = "status " + (isSuccess ? "success" : "error");
    box.innerText = msg;
  }

  function hideStatus() {
    document.getElementById("status-box").style.display = "none";
  }
</script>
</body>
</html>
