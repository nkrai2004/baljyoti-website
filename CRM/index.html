{fmt(feeNet(form.Amount,form.Discount,form.LateFee))} · Balance: {fmt(feeDue(feeNet(form.Amount,form.Discount,form.LateFee),form.PaidAmount))}</p>}{kind==='salaries'&&<p style={{fontSize:12,color:'var(--muted)'}}>Net pay: {fmt(salaryNet(form.Amount,form.Basic,form.Allowances,form.Bonus,form.Deductions))}</p>}</div><div className="modal-foot"><button className="btn secondary" onClick={onClose}><i className="fa-solid fa-xmark"/> Cancel</button><button className="btn" disabled={saving} onClick={()=>onSave(form)}><i className={'fa-solid '+(saving?'fa-spinner fa-spin':'fa-floppy-disk')}/> {saving?'Saving...':'Save record'}</button></div></div></div>;

function FamilyFees({user,students,onClose,onCreated}){const active=students.filter(s=>s.Status==='Active'),groups={};active.forEach(s=>{const k=s.SiblingGroup?'SiblingGroup:'+s.SiblingGroup:s.GuardianPhone?'Phone:'+s.GuardianPhone:'Student:'+s.Id;(groups[k]??=[]).push(s);});const families=Object.entries(groups);const [family,setFamily]=useState(families[0]?.[0]||''),[month,setMonth]=useState(new Date().toISOString().slice(0,7)),[date,setDate]=useState(new Date().toISOString().slice(0,10)),[mode,setMode]=useState('Cash'),[children,setChildren]=useState({}),[busy,setBusy]=useState(false);const kids=groups[family]||[];function val(s){return children[s.Id]||{checked:true,amount:s.MonthlyFee||clsFee(s.Class),discount:Number(s.DiscountPercent||0)*Number(s.MonthlyFee||clsFee(s.Class))/100};}async function submit(){setBusy(true);try{const r=await gsRun('addFamilyFees',{month,paymentDate:date,paymentMode:mode,children:kids.map(s=>({Id:s.Id,...val(s)}))},user.username);if(!r.ok)throw new Error(r.error);if(!r.data.length)throw new Error('All selected children already have a fee row for this month.');onCreated(r.data);notifyAlert('success','Family fees added',r.data.length+' payment rows created. A consolidated receipt is ready to print.');}catch(e){notifyAlert('error','Could not create family fees',e.message);}finally{setBusy(false);}}return <div className="modal-back"><div className="modal"><div className="modal-head"><h3><i className="fa-solid fa-people-roof"/> Family fee collection</h3><button className="mini" onClick={onClose}><i className="fa-solid fa-xmark"/></button></div><div className="modal-body"><div className="form-grid"><div className="field"><label>Family</label><select value={family} onChange={e=>setFamily(e.target.value)}>{families.map(([k,v])=><option value={k} key={k}>{v.map(s=>s.Name).join(', ')}</option>)}</select></div><div className="field"><label>Fee month</label><input type="month" value={month} onChange={e=>setMonth(e.target.value)}/></div><div className="field"><label>Payment date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div><div className="field"><label>Payment mode</label><select value={mode} onChange={e=>setMode(e.target.value)}>{['Cash','UPI','Bank Transfer','Cheque','Card'].map(x=><option key={x}>{x}</option>)}</select></div></div><h4>Children and fee details</h4><div className="family-list">{kids.map(s=><div className="family-child" key={s.Id}><input type="checkbox" checked={val(s).checked} onChange={e=>setChildren(x=>({...x,[s.Id]:{...val(s),checked:e.target.checked}}))}/><b>{s.Name}<small style={{display:'block',color:'var(--muted)'}}>{s.Class} · {s.AdmissionNo}</small></b><input aria-label="Amount" type="number" value={val(s).amount} onChange={e=>setChildren(x=>({...x,[s.Id]:{...val(s),amount:e.target.value}}))}/><input className="paid" aria-label="Discount" type="number" value={val(s).discount} onChange={e=>setChildren(x=>({...x,[s.Id]:{...val(s),discount:e.target.value}}))} placeholder="Discount"/></div>)}</div></div><div className="modal-foot"><button className="btn secondary" onClick={onClose}><i className="fa-solid fa-xmark"/> Cancel</button><button className="btn" onClick={submit} disabled={busy}><i className={'fa-solid '+(busy?'fa-spinner fa-spin':'fa-check')}/> Create fee rows</button></div></div></div>;}
function numToWords(n){n=Math.round(Number(n)||0);if(n===0)return 'Zero Rupees Only';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];function under(x){return x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');}function words(x){if(x>=10000000)return words(Math.floor(x/10000000))+' Crore '+words(x%10000000);if(x>=100000)return words(Math.floor(x/100000))+' Lakh '+words(x%100000);if(x>=1000)return words(Math.floor(x/1000))+' Thousand '+words(x%1000);if(x>=100)return a[Math.floor(x/100)]+' Hundred '+words(x%100);return under(x);}return words(n).trim()+' Rupees Only';}
function PrintHost({doc,onClose}){useEffect(()=>{const t=setTimeout(()=>window.print(),350);const done=()=>onClose();window.addEventListener('afterprint',done);return()=>{clearTimeout(t);window.removeEventListener('afterprint',done);};},[]);const {kind,type,row:r,rows=[]}=doc;let body=null;if(type==='receipt')body=<FeeReceipt row={r}/>;if(type==='family')body=<FamilyReceipt rows={rows}/>;if(type==='challan')body=<FeeChallan row={r} rows={rows}/>;if(type==='salary')body=<SalarySlip row={r}/>;return <div id="fee-receipt" className="print-doc">{body}</div>;}
function Letterhead({tag}){return <div className="print-letter"><div><h2><i className="fa-solid fa-school"/> SCHOOL NAME</h2><small>School address · Phone · Email</small></div><div style={{textAlign:'right'}}><b>{tag}</b><br/><small>Academic administration</small></div></div>;}

function FamilyReceipt({rows}){const total=rows.reduce((a,r)=>a+Number(r.PaidAmount||0),0),net=rows.reduce((a,r)=>a+feeNet(r.Amount,r.Discount,r.LateFee),0),due=rows.reduce((a,r)=>a+Number(r.DueAmount||0),0);return <div><Letterhead tag="FAMILY FEE RECEIPT"/><p><b>Receipt batch:</b> {rows.map(r=>r.ReceiptNo).join(', ')} · <b>Month:</b> {rows[0]?.FeeMonth}</p><table><thead><tr><th>Student</th><th>Receipt</th><th>Amount</th><th>Discount</th><th>Paid</th><th>Balance</th></tr></thead><tbody>{rows.map(r=><tr><td>{r.StudentName}</td><td>{r.ReceiptNo}</td><td>{fmt(r.Amount)}</td><td>{fmt(r.Discount)}</td><td>{fmt(r.PaidAmount)}</td><td>{fmt(r.DueAmount)}</td></tr>)}</tbody><tfoot><tr><th colSpan="2">Family total</th><th>{fmt(net)}</th><th></th><th>{fmt(total)}</th><th>{fmt(due)}</th></tr></tfoot></table><p><b>Amount received in words:</b> {numToWords(total)}</p><div className="print-sign"><span>Parent / Guardian</span><span>Authorised Signatory</span></div></div>;}
function FeeReceipt({row:r}){const net=feeNet(r.Amount,r.Discount,r.LateFee),due=feeDue(net,r.PaidAmount);return <div><Letterhead tag="FEE RECEIPT"/><div style={{display:'flex',justifyContent:'space-between'}}><b>Receipt No: {r.ReceiptNo}</b><span>Date: {(r.PaymentDate||'').slice(0,10)}</span></div><p>Student: <b>{r.StudentName}</b> · Admission No: {r.AdmissionNo||'—'} · Class: {r.Class||'—'}</p><table><thead><tr>{['Amount','Discount','Late Fee','Net Payable','Paid','Balance Due'].map(x=><th>{x}</th>)}</tr></thead><tbody><tr>{[r.Amount,r.Discount,r.LateFee,net,r.PaidAmount,due].map(x=><td>{fmt(x)}</td>)}</tr></tbody></table><p><b>Amount in words:</b> {numToWords(r.PaidAmount)}</p><p><b>Payment status:</b> <span className={'badge '+r.Status}>{r.Status}</span> · Mode: {r.PaymentMode||'—'} · Month: {r.FeeMonth}</p><div className="print-sign"><span>Parent / Guardian</span><span>Authorised Signatory</span></div></div>;}
function FeeChallan({row:r,rows}){const arrears=rows.filter(x=>String(x.StudentId)===String(r.StudentId)&&String(x.FeeMonth)<String(r.FeeMonth)&&!x.IsDeleted).reduce((a,x)=>a+Number(x.DueAmount||0),0),net=feeNet(r.Amount,r.Discount,r.LateFee),total=net+arrears;return <div><Letterhead tag="FEE CHALLAN"/><div className="challan-row">{['BANK COPY','SCHOOL COPY','STUDENT COPY'].map(copy=><div className="challan-copy"><h3>{copy}</h3><b style={{color:'#001f3f'}}>SCHOOL NAME</b><br/><small>School address · Phone · Email</small><br/><b>Challan: CHL-{r.Id}</b><br/>Issue: {(r.PaymentDate||'').slice(0,10)}<br/><b>DUE DATE: {(r.DueDate||'').slice(0,10)||'—'}</b><br/>Month: {r.FeeMonth}<p>Student: {r.StudentName}<br/>Father: {r.FatherName||'—'}<br/>Class: {r.Class||'—'}<br/>Admission: {r.AdmissionNo||r.StudentId}<br/>Roll: {r.RollNo||'—'}</p><table><tbody>{[['Fee head',fmt(r.Amount)],['Less discount',fmt(r.Discount)],['Add late fee',fmt(r.LateFee)],['Net Payable',fmt(net)],['Amount received',fmt(r.PaidAmount)],['Balance This Month',fmt(r.DueAmount)],['Previous Arrears',fmt(arrears)],['Total Payable',fmt(total)]].map(x=><tr><td>{x[0]}</td><td>{x[1]}</td></tr>)}</tbody></table><small>{numToWords(total)}. Please pay before the due date.</small><div style={{marginTop:20}}>Depositor __________<br/><br/>Authorised Signatory</div></div>)}</div></div>;}
function SalarySlip({row:r}){const hasBreakdown=Number(r.Basic||0)||Number(r.Allowances||0)||Number(r.Bonus||0),earn=hasBreakdown?[['Basic',r.Basic],['Allowances',r.Allowances],['Bonus',r.Bonus]]:[['Gross Salary',r.Amount]],ded=[['Deductions',r.Deductions]],gross=(Number(r.Basic||0)||Number(r.Allowances||0)||Number(r.Bonus||0))?Number(r.Basic||0)+Number(r.Allowances||0)+Number(r.Bonus||0):Number(r.Amount||0),totalDed=Number(r.Deductions||0),net=salaryNet(r.Amount,r.Basic,r.Allowances,r.Bonus,r.Deductions),len=Math.max(earn.length,ded.length);return <div><Letterhead tag="SALARY SLIP"/><div className="print-band">Pay slip for the month of {monthLabel(r.SalaryMonth)}</div><table><tbody><tr><th>Employee</th><td>{r.TeacherName}</td><th>Employee ID</th><td>{r.EmployeeId||r.TeacherId}</td></tr><tr><th>Designation / Department</th><td>{r.Designation||'—'} / {r.Department||'—'}</td><th>Joining</th><td>{r.JoinDate||'—'}</td></tr><tr><th>Days present</th><td>{r.DaysPresent||'—'}</td><th>Payment date / mode</th><td>{r.PaymentDate||'—'} / {r.PaymentMode||'—'}</td></tr><tr><th>Bank account / reference</th><td colSpan="3">{r.BankAccount||'—'} / {r.BankReference||'—'}</td></tr></tbody></table><div className="salary-grid"><table><thead><tr><th>EARNINGS</th><th>AMOUNT</th></tr></thead><tbody>{Array.from({length:len},(_,i)=><tr><td>{earn[i]?.[0]||''}</td><td>{earn[i]?fmt(earn[i][1]):''}</td></tr>)}</tbody></table><table><thead><tr><th>DEDUCTIONS</th><th>AMOUNT</th></tr></thead><tbody>{Array.from({length:len},(_,i)=><tr><td>{ded[i]?.[0]||''}</td><td>{ded[i]?fmt(ded[i][1]):''}</td></tr>)}</tbody></table></div><table><tbody><tr style={{background:'#e8eef5'}}><th>Gross Earnings</th><td>{fmt(gross)}</td><th>Total Deductions</th><td>{fmt(totalDed)}</td></tr></tbody></table><div className="net-band">NET PAY (Gross - Deductions): {fmt(net)}</div><p>Net pay in words: <b>{numToWords(net)}</b></p><div style={{background:'#e8f1fa',padding:10,marginTop:10,borderLeft:'4px solid #0074D9'}}><b>Paid:</b> {fmt(r.PaidAmount)} · <b>Balance:</b> {fmt(net-Number(r.PaidAmount||0))} · <b>Status:</b> {r.Status}</div><div className="print-sign"><span>Prepared By</span><span>Authorised Signatory</span><span>Employee Signature</span></div></div>;}
