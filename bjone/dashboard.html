<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BJ ONE Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>

        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f6f9;
        }

        .header{
            background:#0d47a1;
            color:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .container{
            max-width:900px;
            margin:40px auto;
            background:white;
            border-radius:12px;
            padding:30px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        .profile{
            text-align:center;
        }

        .profile img{
            width:90px;
            margin-bottom:15px;
        }

        h1{
            margin-bottom:5px;
        }

        p{
            color:#666;
            margin:6px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:20px;
            margin-top:40px;
        }

        .card{
            background:#f8f9fa;
            padding:25px;
            border-radius:10px;
            text-align:center;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        .card:hover{
            background:#e3f2fd;
        }

        button{

            background:#d32f2f;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:6px;
            cursor:pointer;

        }

        button:hover{

            background:#b71c1c;

        }

    </style>

</head>

<body>

<div class="header">

    <h2>BJ ONE</h2>

    <button onclick="logout()">Logout</button>

</div>

<div class="container">

    <div class="profile">

        <img src="../logo.png">

        <h1 id="userName">Loading...</h1>

        <p id="userRole"></p>

        <p id="userEmail"></p>

    </div>

    <div class="cards">

        <div class="card">
            👨‍🎓 Students
        </div>

        <div class="card">
            👩‍🏫 Teachers
        </div>

        <div class="card">
            💰 Fees
        </div>

        <div class="card">
            🚌 Transport
        </div>

        <div class="card">
            📚 Academics
        </div>

        <div class="card">
            ⚙ Settings
        </div>

    </div>

</div>

<script>

// Check Login

const userName=sessionStorage.getItem("userName");

if(!userName){

    window.location.href="index.html";

}

// Show User Details

document.getElementById("userName").innerHTML=sessionStorage.getItem("userName");

document.getElementById("userRole").innerHTML=sessionStorage.getItem("userRole");

document.getElementById("userEmail").innerHTML=sessionStorage.getItem("userEmail");

// Logout

function logout(){

    sessionStorage.clear();

    if(window.google && google.accounts && google.accounts.id){

        google.accounts.id.disableAutoSelect();

    }

    window.location.href="index.html";

}

</script>

</body>
</html>
