<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJ ONE ERP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
height:100vh;
overflow:hidden;
}

.header{
height:70px;
background:#0D47A1;
color:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
}

.logo{
font-size:24px;
font-weight:bold;
}

.user{
display:flex;
align-items:center;
gap:15px;
}

.logout{
background:#d32f2f;
color:white;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
}

.main{
display:flex;
height:calc(100vh - 70px);
}

.sidebar{
width:250px;
background:#fff;
border-right:1px solid #ddd;
padding:20px;
overflow-y:auto;
}

.content{
flex:1;
padding:25px;
overflow:auto;
background:#f4f6f9;
}

.menu-item{
padding:14px;
margin-bottom:8px;
background:#f5f5f5;
border-radius:8px;
cursor:pointer;
transition:.2s;
}

.menu-item:hover{
background:#E3F2FD;
}

.menu-item.active{
background:#0D47A1;
color:#fff;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">
BJ ONE ERP
</div>

<div class="user">

<span id="userName"></span>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</div>

<div class="main">

<div class="sidebar">

<h3>Menu</h3>

<hr style="margin:15px 0;">

<div id="menu"></div>

</div>

<div class="content" id="content">

Loading Dashboard...

</div>

</div>

<script>

/********************************************************
Version : v0.0.9
********************************************************/

if(!sessionStorage.getItem("userName")){
location.href="index.html";
}

document.getElementById("userName").innerHTML=
sessionStorage.getItem("userName");

const modules=
JSON.parse(sessionStorage.getItem("userModules"))||[];

const icons={
Dashboard:"🏠",
Students:"👨‍🎓",
Teachers:"👩‍🏫",
Fees:"💰",
Transport:"🚌",
Reports:"📊",
Academics:"📚",
Settings:"⚙"
};

const menu=document.getElementById("menu");

function loadModule(module){

let file="";

switch(module){

case "Dashboard":
file="modules/dashboard.html";
break;

case "Students":
file="modules/students.html";
break;

default:

document.getElementById("content").innerHTML=
"<h2>"+module+"</h2><br><p>Module coming soon...</p>";

return;

}

fetch(file)
.then(r=>r.text())
.then(html=>{

document.getElementById("content").innerHTML=html;

})
.catch(()=>{

document.getElementById("content").innerHTML=
"<h2>Error Loading Module</h2>";

});

}

modules.forEach(function(module){

const item=document.createElement("div");

item.className="menu-item";

item.innerHTML=(icons[module]||"📁")+" "+module;

item.onclick=function(){

document.querySelectorAll(".menu-item")
.forEach(x=>x.classList.remove("active"));

item.classList.add("active");

loadModule(module);

};

menu.appendChild(item);

/* Auto Open Dashboard */

if(module==="Dashboard"){

item.classList.add("active");

loadModule("Dashboard");

}

});

function logout(){

sessionStorage.clear();

if(window.google){

google.accounts.id.disableAutoSelect();

}

location.href="index.html";

}

</script>

</body>
</html>
