<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJ ONE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
height:100vh;
}

.header{
height:70px;
background:#0d47a1;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
}

.logo{
font-size:24px;
font-weight:bold;
}

.user{
display:flex;
gap:15px;
align-items:center;
}

.logout{
background:#d32f2f;
color:white;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
}

.main{
display:flex;
height:calc(100vh - 70px);
}

.sidebar{
width:250px;
background:white;
border-right:1px solid #ddd;
padding:20px;
overflow-y:auto;
}

.content{
flex:1;
padding:30px;
}

.menu-item{

padding:12px;

margin-bottom:8px;

background:#f5f5f5;

border-radius:8px;

cursor:pointer;

transition:.2s;

}

.menu-item:hover{

background:#e3f2fd;

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

BJ ONE

</div>

<div class="user">

<span id="userName"></span>

<button class="logout" onclick="logout()">

Logout

</button>

</div>

</div>

<div class="main">

<div class="sidebar">

<h3>Menu</h3>

<hr style="margin:15px 0;">

<div id="menu"></div>

</div>

<div class="content">

<h1>

Welcome

</h1>

<p>

BJ ONE School ERP

</p>

</div>

</div>

<script>

//--------------------------
// Check Login
//--------------------------

if(!sessionStorage.getItem("userName")){

window.location.href="index.html";

}

//--------------------------
// Show Name
//--------------------------

document.getElementById("userName").innerHTML=

sessionStorage.getItem("userName");

//--------------------------
// Read Modules
//--------------------------

const modules=

JSON.parse(sessionStorage.getItem("userModules")) || [];

//--------------------------
// Icons
//--------------------------

const icons={

Dashboard:"🏠",

Students:"👨‍🎓",

Teachers:"👩‍🏫",

Fees:"💰",

Transport:"🚌",

Reports:"📊",

Academics:"📚",

Settings:"⚙"

};

//--------------------------
// Build Menu
//--------------------------

const menu=document.getElementById("menu");

modules.forEach(function(module){

const item=document.createElement("div");

item.className="menu-item";

item.innerHTML=(icons[module] || "📁")+" "+module;

menu.appendChild(item);

});

//--------------------------
// Logout
//--------------------------

function logout(){

sessionStorage.clear();

if(window.google){

google.accounts.id.disableAutoSelect();

}

window.location.href="index.html";

}

</script>

</body>

</html>
