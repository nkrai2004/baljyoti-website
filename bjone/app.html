<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJ ONE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f4f6f9;
    height:100vh;

}

/* HEADER */

.header{

    height:70px;

    background:#0d47a1;

    color:white;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 25px;

}

.logo{

    font-size:24px;

    font-weight:bold;

}

.user{

    display:flex;

    align-items:center;

    gap:15px;

}

.logout{

    background:#d32f2f;

    color:white;

    border:none;

    padding:10px 18px;

    cursor:pointer;

    border-radius:6px;

}

/* MAIN */

.main{

    display:flex;

    height:calc(100vh - 70px);

}

/* SIDEBAR */

.sidebar{

    width:250px;

    background:white;

    border-right:1px solid #ddd;

    padding:20px;

}

/* CONTENT */

.content{

    flex:1;

    padding:30px;

}

.welcome{

    font-size:32px;

    margin-bottom:10px;

}

.subtitle{

    color:#666;

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

BJ ONE

</div>

<div class="user">

<span id="userName"></span>

<button class="logout" onclick="logout()">

Logout

</button>

</div>

</div>

<div class="main">

<div class="sidebar">

<h3>

Menu

</h3>

<hr style="margin:15px 0;">

<div id="menu">

Loading Menu...

</div>

</div>

<div class="content">

<div class="welcome">

Welcome

</div>

<div class="subtitle">

BJ ONE School ERP

</div>

</div>

</div>

<script>

/***************

Check Login

****************/

if(!sessionStorage.getItem("userName")){

    window.location.href="index.html";

}

/***************

Show Name

****************/

document.getElementById("userName").innerHTML=

sessionStorage.getItem("userName");

/***************

Logout

****************/

function logout(){

sessionStorage.clear();

if(window.google){

google.accounts.id.disableAutoSelect();

}

window.location.href="index.html";

}

</script>

</body>

</html>
