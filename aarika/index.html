<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <meta
    name="theme-color"
    content="#a91515">

  <title>AARIKA@School-ERP | Sign In</title>

  <link
    rel="stylesheet"
    href="css/aarika.css">

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>

<body class="login-body">

  <main class="login-shell">

    <section class="login-card">

      <!-- AARIKA Logo -->
      <div class="login-logo">
        A
      </div>

      <!-- School Name -->
      <div class="eyebrow">
        BAL JYOTI PUBLIC SCHOOL
      </div>

      <!-- Welcome -->
      <h1>
        Welcome to AARIKA@School-ERP
      </h1>

      <p>
        School Management &amp; Learning Platform
      </p>


      <!-- =====================================================
           GOOGLE IDENTITY SERVICES
           ===================================================== -->

      <div
        id="g_id_onload"

        data-client_id="927822693870-jn4svic0iuvrchgkqc9kjj8phbe2gopu.apps.googleusercontent.com"

        data-callback="handleGoogleCredential"

        data-auto_prompt="false">
      </div>


      <!-- Google Sign-In Button -->

      <div
        class="g_id_signin"

        data-type="standard"

        data-size="large"

        data-theme="outline"

        data-text="continue_with"

        data-shape="rectangular"

        data-logo_alignment="left">
      </div>


      <!-- Login Error -->

      <div
        id="loginError"
        class="error"
        hidden>
      </div>


      <!-- Authorised Access Notice -->

      <div class="note">

        Only authorised
        <b>@baljyoti.com</b>
        accounts can access this demo.

      </div>

    </section>


    <!-- Footer -->

    <footer>
      AARIKA • Bal Jyoti Public School • Demo
    </footer>

  </main>


  <!-- =====================================================
       AARIKA AUTHENTICATION
       ===================================================== -->

  <script
    type="module"
    src="js/auth.js">
  </script>

</body>
</html>
