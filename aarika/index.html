<!doctype html>
<html lang="en">
<head>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a91515">

  <meta
    http-equiv="Cross-Origin-Opener-Policy"
    content="same-origin-allow-popups">

  <title>AARIKA@school-erp | Sign In</title>

  <link rel="stylesheet" href="css/aarika.css">

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>
</head>

<body class="login-body">

  <main class="login-shell">

    <section class="login-card">

      <div class="login-logo">A</div>

      <div class="eyebrow">
        BAL JYOTI PUBLIC SCHOOL
      </div>

      <h1>Welcome to AARIKA@School-erp</h1>

      <p>
        School Management & Learning Platform
      </p>

      <!-- Google Sign-In -->
      <div
        id="g_id_onload"
        data-client_id="594079296208-rrfpja5335vp8cv9vt8fnofub0au20pb.apps.googleusercontent.com"
        data-callback="handleGoogleCredential"
        data-auto_prompt="false">
      </div>

      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="continue_with"
        data-shape="rectangular"
        data-logo_alignment="left">
      </div>

      <div
        id="loginError"
        class="error"
        hidden>
      </div>

      <div class="note">
        Only authorised
        <b>@baljyoti.com</b>
        accounts can access this demo.
      </div>

    </section>

    <footer>
      AARIKA • Bal Jyoti Public School • Demo
    </footer>

  </main>

  <!-- IMPORTANT: auth.js uses ES modules -->
  <script
    type="module"
    src="js/auth.js">
  </script>

</body>
</html>
