<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <meta
    name="theme-color"
    content="#a91515">

  <title>AARIKA@School-ERP | Sign In</title>


  <!-- AARIKA CSS -->
  <link
    rel="stylesheet"
    href="css/aarika.css">


  <!-- =====================================================
       GOOGLE IDENTITY SERVICES
       ===================================================== -->

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>


  <!-- =====================================================
       GOOGLE CALLBACK BRIDGE

       IMPORTANT:
       This MUST exist before Google Identity Services
       tries to initialise.
       ===================================================== -->

  <script>

    window.handleGoogleCredential = function (response) {

      console.log(
        "AARIKA: Google callback received."
      );

      /*
       * auth.js may not have finished loading yet.
       *
       * Store the credential temporarily.
       */

      window.__AARIKA_GOOGLE_RESPONSE__ = response;

      /*
       * Tell auth.js that Google login is ready.
       */

      window.dispatchEvent(
        new CustomEvent(
          "aarika-google-credential",
          {
            detail: response
          }
        )
      );

    };

  </script>

</head>


<body class="login-body">


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <main class="login-shell">


    <section class="login-card">


      <!-- LOGO -->

      <div class="login-logo">
        A
      </div>


      <!-- SCHOOL -->

      <div class="eyebrow">
        BAL JYOTI PUBLIC SCHOOL
      </div>


      <!-- TITLE -->

      <h1>
        Welcome to AARIKA@School-ERP
      </h1>


      <!-- DESCRIPTION -->

      <p>
        School Management &amp; Learning Platform
      </p>


      <!-- =================================================
           GOOGLE IDENTITY SERVICES
           ================================================= -->

      <div
        id="g_id_onload"

        data-client_id="927822693870-jn4svic0iuvrchgkqc9kjj8phbe2gopu.apps.googleusercontent.com"

        data-callback="handleGoogleCredential"

        data-auto_prompt="false">
      </div>


      <!-- GOOGLE BUTTON -->

      <div
        class="g_id_signin"

        data-type="standard"

        data-size="large"

        data-theme="outline"

        data-text="continue_with"

        data-shape="rectangular"

        data-logo_alignment="left">
      </div>


      <!-- LOGIN ERROR -->

      <div
        id="loginError"
        class="error"
        hidden>
      </div>


      <!-- ACCESS NOTICE -->

      <div class="note">

        Only authorised
        <b>@baljyoti.com</b>
        accounts can access AARIKA.

      </div>


    </section>


    <!-- FOOTER -->

    <footer>

      AARIKA • Bal Jyoti Public School • Demo

    </footer>


  </main>


  <!-- =====================================================
       AARIKA AUTHENTICATION
       ===================================================== -->

  <script
    type="module"
    src="js/auth.js">
  </script>


</body>

</html>
