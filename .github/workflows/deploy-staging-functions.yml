name: Deploy Bal Jyoti Staging Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy approved staging functions only
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy to staging only
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_STAGING" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_STAGING"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only functions:approveStaffUser,functions:deleteSchoolUser,functions:setUserModuleOverrides,functions:createSchoolTask,functions:updateSchoolTaskStatus,functions:submitSchoolNotice,functions:reviewSchoolNotice,functions:submitSchoolCalendarEvent,functions:reviewSchoolCalendarEvent,functions:listMySchoolTasks,functions:listMySchoolNoticeSubmissions,functions:listPendingSchoolNotices,functions:listMySchoolCalendarSubmissions,functions:listPendingSchoolCalendarEvents,functions:resubmitRejectedSchoolNotice,functions:resubmitRejectedSchoolCalendarEvent --project baljyoti-school-os-staging --non-interactive
