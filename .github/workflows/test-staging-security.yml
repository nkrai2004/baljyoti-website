name: School OS security tests

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/test-staging-security.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/test-staging-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --include=dev
      - name: Run pure validation and Firestore rules tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-baljyoti-school-os "npm test --prefix functions"
