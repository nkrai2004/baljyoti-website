name: School OS security tests

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/test-staging-security.yml"
      - ".github/workflows/deploy-staging-functions.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/test-staging-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --include=dev
      - name: Provide dummy SMTP values for emulator-only startup
        run: |
          printf 'SMTP_HOST=127.0.0.1\nSMTP_PORT=2525\nSMTP_USER=emulator\nSMTP_PASS=emulator\n' > functions/.secret.local
      - name: Run pure validation and Firestore rules tests
        run: npx --yes firebase-tools emulators:exec --only auth,firestore,functions --project demo-baljyoti-school-os "npm test --prefix functions && npm run test:callables --prefix functions"
